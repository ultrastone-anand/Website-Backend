<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================================
         BASIC DOCUMENT CONFIGURATION
    ========================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#ffffff" />

    <!-- =========================================================
         PERFORMANCE: PRECONNECT

         Establish connections to important external
         resources before they are requested.
    ========================================================== -->

    <link
      rel="preconnect"
      href="https://cdn.ultrastone.in"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://backend.ultrastones.com"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- =========================================================
         GOOGLE FONTS - NON-BLOCKING

         Font stylesheet is loaded without blocking
         the initial page render.

         font-display=swap allows fallback fonts
         while custom fonts download.
    ========================================================== -->

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

    <!-- Fallback for browsers with JavaScript disabled -->

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- =========================================================
         GOOGLE TAG MANAGER

         Preserved existing GTM implementation.
    ========================================================== -->

    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];

        w[l].push({
          "gtm.start": new Date().getTime(),
          event: "gtm.js",
        });

        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";

        j.async = true;

        j.src =
          "https://www.googletagmanager.com/gtm.js?id=" +
          i +
          dl;

        f.parentNode.insertBefore(j, f);
      })(
        window,
        document,
        "script",
        "dataLayer",
        "GTM-NR3PXVZX"
      );
    </script>

    <!-- =========================================================
         GOOGLE ANALYTICS 4

         Preserved existing GA4 implementation.

         Important:
         Verify GA4 is not also firing through GTM.
    ========================================================== -->

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-70GS6LZ9FB"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());

      gtag("config", "G-70GS6LZ9FB");
    </script>
